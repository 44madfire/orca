name: E2E
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wayland:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install nested compositor and IME
        run: >-
          sudo apt-get update && sudo apt-get install -y
          build-essential python3 dbus-x11 dconf-gsettings-backend ibus ibus-hangul
          gnome-shell gnome-settings-daemon libglib2.0-bin xdotool xvfb x11-utils imagemagick
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build current main
        env:
          VITE_EXPOSE_STORE: 'true'
        run: |
          pnpm run build:relay
          pnpm exec electron-vite build --mode e2e
          pnpm run build:web-from-renderer
      - name: Run original native Wayland scenario
        run: xvfb-run --auto-servernum --server-args='-screen 0 1280x800x24' dbus-run-session -- bash config/scripts/diagnose-nested-wayland-session.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: native-wayland-hangul-audit
          path: test-results/
          retention-days: 3
