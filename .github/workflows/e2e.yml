name: AI Vault typing audit
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install headless tools
        run: sudo apt-get update && sudo apt-get install -y build-essential openssh-client python3 ripgrep xvfb zsh openbox x11-utils
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build Electron
        env:
          VITE_EXPOSE_STORE: "true"
        run: pnpm exec electron-vite build --mode e2e
      - name: Run full default Vault benchmark
        run: >-
          xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh
          env SKIP_BUILD=1 ORCA_AI_VAULT_TYPING_BENCH=1 ORCA_E2E_FORWARD_APP_LOGS=1
          pnpm exec playwright test --config tests/playwright.config.ts
          tests/e2e/terminal-ai-vault-typing-latency.spec.ts
          --project=electron-headless --workers=1 --retries=0
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ai-vault-typing-audit
          path: |
            test-results/
            tests/tools/benchmarks/results/
          retention-days: 3
