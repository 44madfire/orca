name: Renderer context diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  context:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential python3 xvfb openbox x11-utils ripgrep
      - uses: ./.github/actions/install-node-dependencies
        with:
          native-runtime: electron
      - name: Build E2E app
        run: pnpm exec electron-vite build --mode e2e
      - name: Run original creation and switching scenario
        shell: bash
        env:
          SKIP_BUILD: '1'
          ORCA_E2E_FORWARD_APP_LOGS: '1'
          PLAYWRIGHT_JSON_OUTPUT_FILE: test-results/context-participation.json
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            xvfb-run --auto-servernum bash .github/scripts/e2e-with-window-manager.sh pnpm exec playwright test --config tests/playwright.config.ts tests/e2e/dead-terminal-repro.spec.ts --project electron-headful --grep "rapid switching between many" --repeat-each=5 --workers=1 --reporter=list,json --retries=0
          else
            pnpm exec playwright test --config tests/playwright.config.ts tests/e2e/dead-terminal-repro.spec.ts --project electron-headful --grep "rapid switching between many" --repeat-each=5 --workers=1 --reporter=list,json --retries=0
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renderer-context-diagnostic
          path: test-results/
          retention-days: 7
          if-no-files-found: error
